name: Build Tailscale APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build SFA APK (ARM64-v8a)
        run: |
          # 安裝 gomobile 工具
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          # 核心步驟：加上 with_tailscale 標籤進行編譯
          make -C android TAGS="with_quic,with_dhcp,with_wireguard,with_tailscale,with_utls,with_gvisor" ARCH=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-tailscale-v8a
          path: android/app/build/outputs/apk/release/*.apk
